<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Personal Trainer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Personal Trainer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F4D3A">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#F3F6F1; --surface:#FFFFFF; --ink:#16201A; --muted:#58675D; --line:#D3DCD0;
  --pitch:#1F4D3A; --on-pitch:#FFFFFF; --turf:#E2EBDD; --ball:#9E1F27; --seam:#F2E2BF; --warn:#9A5B00;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1511; --surface:#16201A; --ink:#E6ECE5; --muted:#9CAAA0; --line:#2A3A30;
    --pitch:#7DBB98; --on-pitch:#0E1511; --turf:#1C2A22; --ball:#C2373F; --seam:#F2E2BF; --warn:#E3A64A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Avenir Next","Avenir","Segoe UI",Roboto,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 110px}
h1,h2,h3{margin:0;letter-spacing:-0.01em}
h1{font-size:28px;font-weight:800;line-height:1.1}
h2{font-size:20px;font-weight:750}
h3{font-size:16px;font-weight:700}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.band{background:var(--pitch);color:var(--on-pitch);margin:0 -16px 16px;padding:calc(22px + env(safe-area-inset-top)) 16px 20px;border-radius:0 0 22px 22px}
.band .muted{color:inherit;opacity:.8}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.flat{background:transparent;border:none;padding:0}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.grow{flex:1}
button,select,input{font:inherit;color:inherit}
.btn{border:none;border-radius:12px;padding:14px 16px;font-weight:700;background:var(--pitch);color:var(--on-pitch);cursor:pointer;width:100%;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.red{background:var(--ball);color:#fff}
.btn.sm{padding:8px 12px;font-size:14px;width:auto;border-radius:10px}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
input,select{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px;width:100%}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:13px;color:var(--muted)}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
ul.plain li:last-child{border-bottom:none}
.bar{height:6px;background:var(--turf);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ball)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;background:none;border:none;padding:12px 2px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button[aria-current=page]{color:var(--ink)}
.tabs button[aria-current=page]::before{content:"";display:block;width:8px;height:8px;border-radius:50%;background:var(--ball);margin:0 auto 4px}
.tabs button::before{content:"";display:block;width:8px;height:8px;margin:0 auto 4px}
/* the ball */
.ballwrap{display:flex;justify-content:center;margin:18px 0 8px}
.ball{position:relative;width:210px;height:210px;border-radius:50%;border:none;cursor:pointer;overflow:hidden;
  background:radial-gradient(circle at 34% 28%, #d4555b 0%, var(--ball) 45%, #5e1015 100%);
  box-shadow:inset -14px -18px 30px rgba(0,0,0,.35), 0 10px 24px rgba(94,16,21,.28);color:#fff;touch-action:manipulation}
.ball::before{content:"";position:absolute;top:-10%;bottom:-10%;left:45%;width:10%;transform:rotate(18deg);
  border-left:3px dotted var(--seam);border-right:3px dotted var(--seam);opacity:.9}
.ball .count{position:relative;font-size:78px;font-weight:800;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.ball .lbl{position:relative;display:block;font-size:14px;font-weight:600;opacity:.9;margin-top:4px}
.ball.pop{animation:pop .14s ease-out}
@keyframes pop{50%{transform:scale(.95)}}
@media (prefers-reduced-motion:reduce){.ball.pop{animation:none}}
.chk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.chk:last-child{border-bottom:none}
.box{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:800;font-size:14px}
.chk[aria-pressed=true] .box{background:var(--pitch);border-color:var(--pitch);color:var(--on-pitch)}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;background:var(--turf);font-size:13px;font-weight:600}
.exrow{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:none}
details summary{cursor:pointer;font-weight:600}
ol.how{margin:8px 0 0;padding-left:20px}
ol.how li{margin-bottom:4px}
.timer{position:fixed;inset:0;background:var(--pitch);color:var(--on-pitch);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.timer[hidden]{display:none}
.timer .big{font-size:110px;font-weight:800;line-height:1}
.timer .seg{font-size:24px;font-weight:700;margin-top:6px}
.timer .btn{max-width:320px}
.timer .btn.ghost{color:var(--on-pitch);border-color:currentColor}
.who{display:flex;gap:6px;margin-bottom:14px}
.who button{flex:1;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:20px;padding:7px 10px;font-weight:700;font-size:14px;cursor:pointer;opacity:.75}
.who button[aria-pressed=true]{background:var(--on-pitch);color:var(--pitch);border-color:var(--on-pitch);opacity:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:90%}
.toast[hidden]{display:none}
svg text{fill:var(--muted);font-size:10px}
.setdots{display:flex;gap:6px;justify-content:center;margin-top:6px}
.setdots span{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.setdots span.on{background:var(--pitch);border-color:var(--pitch)}
.setdots span.now{border-color:var(--ball)}
</style>
</head>
<body>
<main class="wrap" id="view" aria-live="polite"><p class="muted" style="padding-top:40px">Loading your plan…</p></main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="today">Today</button>
  <button data-tab="plan">Plan</button>
  <button data-tab="food">Food</button>
  <button data-tab="progress">Progress</button>
  <button data-tab="profile">Profile</button>
</nav>

<div class="timer" id="timer" hidden role="dialog" aria-modal="true" aria-label="Timer">
  <div id="tTitle" style="font-size:18px;opacity:.85"></div>
  <div class="big num" id="tBig">0:00</div>
  <div class="seg" id="tSeg"></div>
  <div id="tSub" style="opacity:.8;margin:6px 0 28px"></div>
  <div class="row" style="width:100%;max-width:320px">
    <button class="btn ghost" data-act="tpause" id="tPause">Pause</button>
    <button class="btn ghost" data-act="tskip">Skip</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Exercise library ---------- */
const EX = {
  mobility_warm:{name:"Dynamic warm-up",type:"time",cat:"mob",eq:"bw",time:300,sets:1,how:["2 min easy on the bike or treadmill","10 leg swings each direction per leg, 10 arm circles each way","10 bodyweight squats, then 5 world's-greatest-stretch lunges per side"],alt:["yoga_flow"]},
  deadlift:{name:"Barbell deadlift",type:"reps",cat:"main",eq:"bb",how:["Bar over mid-foot, feet hip-width, hands just outside your legs","Brace your belly, flat back, then push the floor away","Stand tall, then lower by pushing your hips back first"],alt:["rdl","hip_thrust"]},
  rdl:{name:"Barbell Romanian deadlift",type:"reps",cat:"main",eq:"bb",how:["Stand holding the bar, knees slightly soft","Push hips back so the bar slides down your thighs to mid-shin","Feel the hamstring stretch, then drive hips forward to stand"],alt:["deadlift","hip_thrust"]},
  hip_thrust:{name:"Barbell hip thrust",type:"reps",cat:"acc",eq:"bb",how:["Upper back on the bench, bar across your hips (pad it with a folded mat)","Drive through your heels until hips are level with knees","Squeeze glutes for 1 second at the top, ribs down"],alt:["split_squat","goblet_squat"]},
  split_squat:{name:"Bulgarian split squat",type:"reps",cat:"acc",eq:"db",per:"leg",how:["Rear foot on the bench, front foot about 2 feet ahead, a dumbbell in each hand","Lower until your back knee nearly touches the floor","Drive up through the front heel. Reps are per leg"],alt:["goblet_squat","walking_lunge"]},
  goblet_squat:{name:"Goblet squat (pause)",type:"reps",cat:"acc",eq:"db",how:["Hold one dumbbell against your chest, elbows pointing down","Sit down between your heels, chest up","Pause 2 seconds at the bottom to make a light weight harder"],alt:["split_squat"]},
  walking_lunge:{name:"Dumbbell walking lunge",type:"reps",cat:"acc",eq:"db",per:"leg",how:["A dumbbell in each hand, stand tall","Take a long step, lower your back knee toward the floor","Push off and step through. Reps are per leg (lunge in place if space is tight)"],alt:["split_squat","lateral_lunge"]},
  calf_raise:{name:"Single-leg calf raise",type:"reps",cat:"acc",eq:"bw",per:"leg",how:["Ball of your foot on a weight plate, hold something for balance","Lower your heel all the way, then rise as high as you can","Reps per leg. Hold a dumbbell once 20 reps feels easy"],alt:[]},
  tread_sprints:{name:"Treadmill sprints",type:"interval",cat:"cond",eq:"bw",rounds:6,step:1,work:20,rest:40,how:["Set a fast pace. Straddle the belt while it speeds up, then hop on","Run hard for the work period, at a pace you can repeat every round","Straddle the belt or walk slowly during rest"],cric:"Mimics running between the wickets.",alt:["bike_intervals"]},
  bench:{name:"Barbell bench press",type:"reps",cat:"main",eq:"bb",how:["Eyes under the bar, squeeze shoulder blades together, feet flat","Lower the bar to mid-chest with elbows at about 45°","Press up and slightly back. No spotter, so stop 2 reps before failure"],alt:["db_bench","pushup"]},
  db_bench:{name:"Dumbbell bench press",type:"reps",cat:"acc",eq:"db",how:["Lie on the bench, dumbbells at chest level","Press up until arms are straight","Lower slowly, taking 3 seconds on the way down"],alt:["bench","pushup"]},
  pullup:{name:"Pull-up",type:"reps",cat:"main",eq:"bw",how:["Hands just wider than shoulders, palms facing away","Pull your chest toward the bar, elbows down to your ribs","Lower all the way. Loop a band under your feet for help; do what you can and log it"],alt:["chinup","db_row"]},
  chinup:{name:"Chin-up",type:"reps",cat:"main",eq:"bw",how:["Hands shoulder-width, palms facing you","Pull your chin over the bar","Lower all the way down. Use a band if needed"],alt:["pullup"]},
  bb_row:{name:"Barbell bent-over row",type:"reps",cat:"main",eq:"bb",how:["Hinge forward to about 45°, flat back, soft knees","Pull the bar to your belly button","Lower under control, no swinging"],alt:["db_row"]},
  db_row:{name:"One-arm dumbbell row",type:"reps",cat:"acc",eq:"db",per:"side",how:["One hand and knee on the bench, back flat","Pull the dumbbell to your hip","Pause 1 second at the top. Reps per side"],alt:["bb_row"]},
  db_press:{name:"Dumbbell shoulder press",type:"reps",cat:"acc",eq:"db",how:["Sit tall on the bench, dumbbells at shoulder height","Press up until your arms are straight, without arching your back","Lower to ear level"],alt:["pushup"]},
  dips:{name:"Dips",type:"reps",cat:"acc",eq:"bw",how:["Support yourself on the dip bars, arms straight","Lean slightly forward and lower until shoulders reach elbow height","Press back up. Use a band for help if needed"],alt:["pushup","db_bench"]},
  pushup:{name:"Push-up",type:"reps",cat:"acc",eq:"bw",how:["Hands just wider than shoulders, body in a straight line","Lower your chest to a fist's height from the floor","Push up. Use the push-up handles on your station for extra depth"],alt:["dips"]},
  face_pull:{name:"Band face pull",type:"reps",cat:"acc",eq:"band",how:["Anchor the band at face height","Pull toward your forehead with elbows high","Squeeze shoulder blades together. Great for shoulder health and posture"],cric:"Protects your bowling and throwing shoulder.",alt:["band_er"]},
  band_er:{name:"Band external rotation",type:"reps",cat:"acc",eq:"band",per:"side",how:["Band anchored at elbow height, elbow tucked at your side","Rotate your forearm outward, keeping the elbow pinned","Reps per side. Slow and controlled"],alt:["face_pull"]},
  l_raise:{name:"Knee raise / L-raise",type:"reps",cat:"core",eq:"bw",how:["Forearms on the station pads, back against the support","Lift knees to chest (straight legs to an L once that's easy)","Lower slowly, no swinging"],alt:["dead_bug"]},
  bike_intervals:{name:"Bike intervals",type:"interval",cat:"cond",eq:"bw",rounds:8,step:2,work:30,rest:30,how:["Spin easy for a minute before you start","Work: pedal hard against heavy resistance","Rest: easy spin, light resistance"],alt:["tread_sprints"]},
  tread_steady:{name:"Steady treadmill run",type:"time",cat:"cond",eq:"bw",time:900,timeStep:180,sets:1,how:["Conversational pace: you can talk in full sentences","Add 1–2% incline if it feels too easy","Builds your aerobic base and recovery between hard efforts"],cric:"Builds the engine to bat a long innings and field all day.",alt:["bike_steady"]},
  bike_steady:{name:"Steady bike ride",type:"time",cat:"cond",eq:"bw",time:900,timeStep:180,sets:1,how:["Moderate resistance, steady cadence","You should be able to talk, just","Easier on the knees than running"],alt:["tread_steady"]},
  plank:{name:"Plank",type:"time",cat:"core",eq:"bw",how:["Forearms under shoulders, body in a straight line","Squeeze glutes, pull ribs down","Breathe steadily. Stop if your hips sag"],alt:["dead_bug"]},
  side_plank:{name:"Side plank",type:"time",cat:"core",eq:"bw",per:"side",how:["Forearm under your shoulder, feet stacked","Lift hips into a straight line","The timer runs left side, then right side"],alt:["pallof"]},
  dead_bug:{name:"Dead bug",type:"reps",cat:"core",eq:"bw",per:"side",how:["Lie on your back, arms up, knees bent over hips","Slowly lower opposite arm and leg, lower back pressed flat","Return and switch. Reps per side"],alt:["plank"]},
  pallof:{name:"Band Pallof press",type:"reps",cat:"core",eq:"band",per:"side",how:["Band anchored at chest height, standing side-on to it","Press your hands straight out and resist the twist","Hold 2 seconds. Reps per side"],cric:"Builds a stable trunk for batting.",alt:["side_plank"]},
  russian_twist:{name:"Dumbbell Russian twist",type:"reps",cat:"core",eq:"db",how:["Sit, lean back slightly, feet on the floor (lift them for harder)","Rotate a dumbbell from side to side","Reps total. Turn from your ribs, not just your arms"],alt:["woodchop"]},
  cooldown:{name:"Cool-down stretch",type:"time",cat:"mob",eq:"bw",time:420,sets:1,how:["Hamstring stretch 45 s per leg, hip flexor lunge stretch 45 s per side","Doorway chest stretch 45 s, sleeper stretch for shoulders 30 s per side","Child's pose 1 min, breathe slowly"],alt:["yoga_flow"]},
  squat_jump:{name:"Squat jump",type:"reps",cat:"power",eq:"bw",how:["Quarter squat, arms swung back","Jump as high as you can, swinging arms up","Land soft and quiet, reset before each rep"],alt:["lateral_lunge"]},
  plyo_pushup:{name:"Explosive push-up",type:"reps",cat:"power",eq:"bw",how:["Normal push-up position","Push up fast so your hands leave the floor (or just push as fast as possible)","Land soft and reset each rep"],alt:["pushup"]},
  woodchop:{name:"Band woodchop",type:"reps",cat:"power",eq:"band",per:"side",how:["Band anchored high, to one side","Pull diagonally down across your body, pivoting your back foot","Reps per side. Builds rotational power"],cric:"Mirrors batting and bowling rotation.",alt:["russian_twist","pallof"]},
  lateral_lunge:{name:"Lateral lunge",type:"reps",cat:"acc",eq:"db",per:"side",how:["Wide stance, holding a dumbbell at your chest","Step and sit into one hip, other leg straight, chest up","Push back to center. Reps per side"],cric:"Builds side-to-side movement for fielding.",alt:["walking_lunge"]},
  farmer_carry:{name:"Farmer carry",type:"time",cat:"cond",eq:"db",time:40,sets:3,restT:60,how:["Heaviest dumbbell in each hand","Walk tall with short, quick steps (march in place if space is tight)","Builds grip and core strength"],cric:"A stronger grip means a firmer bat.",alt:["plank"]},
  yoga_flow:{name:"Yoga flow",type:"time",cat:"mob",eq:"bw",time:600,sets:1,how:["Downward dog 5 breaths, cobra 5 breaths, repeat twice","Pigeon pose 1 min per side, lizard pose 45 s per side","Seated forward fold 1 min, lying twist 30 s per side"],alt:["cooldown"]}
};

/* ---------- 6-month phases ---------- */
const PH = [
  {name:"Foundation",from:1,to:4,tip:"Learn the moves. Finish every set feeling you had 3 more reps in you.",
   main:{s:3,r:10,rest:90},acc:{s:3,r:12,rest:60},core:{s:2,r:12,rest:45},power:{s:3,r:6,rest:60},hold:30},
  {name:"Build",from:5,to:12,tip:"Add weight whenever you hit every rep. Stop 2 reps short of failure.",
   main:{s:4,r:8,rest:90},acc:{s:3,r:10,rest:60},core:{s:3,r:15,rest:45},power:{s:3,r:6,rest:60},hold:40},
  {name:"Strength",from:13,to:20,tip:"Heavier main lifts, longer rest. Quality reps only.",
   main:{s:4,r:6,rest:120},acc:{s:3,r:8,rest:75},core:{s:3,r:15,rest:45},power:{s:4,r:5,rest:75},hold:45},
  {name:"Peak",from:21,to:26,tip:"Speed and power. Move every rep fast.",
   main:{s:3,r:5,rest:120},acc:{s:3,r:10,rest:60},core:{s:3,r:20,rest:45},power:{s:5,r:4,rest:75},hold:60}
];

const DEFAULT_PLAN = [
  {id:"A",name:"Legs and speed",items:["mobility_warm","deadlift","hip_thrust","split_squat","calf_raise","tread_sprints"]},
  {id:"B",name:"Upper body strength",items:["mobility_warm","bench","pullup","bb_row","db_press","dips","face_pull","l_raise"]},
  {id:"C",name:"Engine and core",items:["bike_intervals","tread_steady","side_plank","pallof","dead_bug","russian_twist","cooldown"]},
  {id:"D",name:"Power and flexibility",items:["mobility_warm","squat_jump","plyo_pushup","rdl","db_row","woodchop","lateral_lunge","farmer_carry","yoga_flow"]}
];

const WIFE_PLAN = [
  {id:"A",name:"Lower body",items:["mobility_warm","goblet_squat","rdl","hip_thrust","split_squat","calf_raise","bike_intervals"]},
  {id:"B",name:"Upper body",items:["mobility_warm","db_bench","db_row","db_press","pushup","face_pull","plank"]},
  {id:"C",name:"Cardio and core",items:["tread_steady","bike_intervals","dead_bug","side_plank","pallof","cooldown"]},
  {id:"D",name:"Full body and flexibility",items:["mobility_warm","squat_jump","walking_lunge","lateral_lunge","farmer_carry","russian_twist","yoga_flow"]}
];

const PROTEIN = {
  any:["Chicken breast, 100 g cooked: about 31 g","Fish, 100 g cooked: about 22–25 g","Eggs: about 6 g each","Greek yogurt, 200 g: about 20 g","Paneer, 100 g: about 18 g","Whey, 1 scoop: about 20–25 g"],
  egg:["Eggs: about 6 g each","Paneer, 100 g: about 18 g","Greek yogurt or hung curd, 200 g: about 20 g","Soy chunks, 50 g dry: about 25 g","Dal, 1 cup cooked: about 15 g","Whey, 1 scoop: about 20–25 g"],
  veg:["Paneer, 100 g: about 18 g","Greek yogurt or hung curd, 200 g: about 20 g","Soy chunks, 50 g dry: about 25 g","Tofu, 100 g firm: about 12–15 g","Dal or rajma, 1 cup cooked: about 15 g","Whey, 1 scoop: about 20–25 g"],
  vegan:["Soy chunks, 50 g dry: about 25 g","Tofu, 100 g firm: about 12–15 g","Tempeh, 100 g: about 19 g","Lentils, 1 cup cooked: about 18 g","Chickpeas, 1 cup cooked: about 14 g","Pea or soy protein, 1 scoop: about 20–25 g"]
};

/* ---------- State ---------- */
const KEY="mytrainer-v1", OLDKEYS=["netsession-v1"];
let R=null, S=null;
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
function todayStr(d=new Date()){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function planFor(id){return JSON.parse(JSON.stringify(id==="wife"?WIFE_PLAN:DEFAULT_PLAN))}
function defaultPerson(id){
  const t=todayStr();
  const profile=id==="wife"
    ? {name:"Wife",age:0,height:0,sex:"f",goal:0,start:t,days:3,diet:"any",cricket:false}
    : {name:"Me",age:0,height:0,sex:"m",goal:0,start:t,days:4,diet:"any",cricket:true};
  return {profile,plan:planFor(id),overrides:{},logs:[],weights:[],daily:{},session:null,tab:"today"};
}
function defaultRoot(){return {v:2,active:"me",people:{me:defaultPerson("me"),wife:defaultPerson("wife")}}}
/* One-time update: the first release pre-filled placeholder stats. Clear any that were
   never edited so each person enters their own in Profile. Workouts are kept. */
function migrate(){
  if(R.v>=2) return;
  for(const per of Object.values(R.people||{})){
    const p=per.profile; if(!p) continue;
    if(p.age===30) p.age=0;
    if((p.sex==="m"&&p.height===175)||(p.sex==="f"&&p.height===163)) p.height=0;
    if(p.goal===84) p.goal=0;
    if(per.weights.length===1&&per.weights[0].kg===89&&!per.logs.length) per.weights=[];
  }
  R.v=2;
}
async function readKey(k){
  if(window.storage){ try{const r=await window.storage.get(k,false); return r&&r.value?JSON.parse(r.value):null;}catch(e){return null;} }
  try{const v=localStorage.getItem(k); return v?JSON.parse(v):null;}catch(e){return null;}
}
async function load(){
  R=await readKey(KEY);
  if(!R||!R.people){
    R=defaultRoot();

  }
  migrate();
  if(!R.people[R.active]) R.active=Object.keys(R.people)[0];
  S=R.people[R.active];
  render(); save();
}

/* ---------- Helpers ---------- */
function weekNo(){
  const st=new Date(S.profile.start+"T00:00:00"); const d=Math.floor((Date.now()-st)/864e5);
  return Math.max(1,Math.min(26,Math.floor(d/7)+1));
}
function phaseIdx(){const w=weekNo(); return PH.findIndex(p=>w>=p.from&&w<=p.to)}
function curWeight(){return S.weights.length?S.weights[S.weights.length-1].kg:null}
function startWeight(){return S.weights.length?S.weights[0].kg:null}
function getW(id){return S.plan.find(w=>w.id===id)}
function rotation(){return S.profile.days==3?["A","B","D"]:["A","B","C","D"]}
function nextWid(){
  const rot=rotation(); const last=[...S.logs].reverse().find(l=>rot.includes(l.wid));
  if(!last) return rot[0];
  return rot[(rot.indexOf(last.wid)+1)%rot.length];
}
function perTxt(ex){return ex.per==="leg"?" per leg":ex.per==="side"?" per side":""}
function tgt(wid,id){
  const ex=EX[id], pi=phaseIdx(), P=PH[pi]; let t;
  if(ex.type==="interval") t={sets:1,rounds:ex.rounds+pi*ex.step,work:ex.work,rest:ex.rest};
  else if(ex.type==="time"){
    if(ex.cat==="core") t={sets:P.core.s,secs:P.hold,rest:45};
    else t={sets:ex.sets||1,secs:ex.time+(ex.timeStep||0)*pi,rest:ex.restT||60};
  } else { const c=P[ex.cat]||P.acc; t={sets:c.s,reps:c.r,rest:c.rest}; }
  const o=S.overrides[wid+":"+id];
  if(o){ if(o.sets) t.sets=+o.sets; if(o.reps&&t.reps) t.reps=+o.reps; if(o.secs&&t.secs) t.secs=+o.secs; if(o.rounds&&t.rounds) t.rounds=+o.rounds; }
  return t;
}
function tgtTxt(wid,id){
  const ex=EX[id], t=tgt(wid,id);
  if(ex.type==="interval") return t.rounds+" rounds: "+t.work+" s hard, "+t.rest+" s easy";
  if(ex.type==="time") return (t.sets>1?t.sets+" × ":"")+fmtDur(t.secs)+perTxt(ex);
  return t.sets+" × "+t.reps+perTxt(ex);
}
function fmtDur(s){return s>=60?(Math.round(s/60*10)/10)+" min":s+" s"}
function fmtClock(s){return Math.floor(s/60)+":"+pad(s%60)}
function estMin(w){
  let s=0;
  w.items.forEach(id=>{const ex=EX[id],t=tgt(w.id,id),m=ex.per?1.8:1;
    if(ex.type==="interval") s+=t.rounds*(t.work+t.rest)+60;
    else if(ex.type==="time") s+=t.sets*(t.secs*m+t.rest);
    else s+=t.sets*(40*m+t.rest);});
  return Math.round(s/60);
}
function lastSets(id){
  for(let i=S.logs.length-1;i>=0;i--){const x=S.logs[i].sets[id]; if(x&&x.length) return {sets:x,wid:S.logs[i].wid,date:S.logs[i].date};}
  return null;
}
function suggest(wid,id){
  const ex=EX[id]; if(ex.eq!=="bb"&&ex.eq!=="db") return {w:0,note:"Pick a weight you can lift for every rep with 2–3 reps to spare."};
  const L=lastSets(id); const t=tgt(wid,id);
  if(!L) return {w:0,note:"First time: pick a weight you can lift for every rep with 2–3 reps to spare."};
  const w=Math.max(...L.sets.map(s=>s.w||0));
  const hit=L.sets.length>=t.sets&&L.sets.every(s=>s.reps>=t.reps);
  if(hit){
    if(ex.eq==="db"&&w>=25) return {w,note:"You're at your heaviest dumbbells. Make it harder: take 3 seconds to lower each rep."};
    return {w:w+5,note:"You hit every rep last time, so +5 lb."};
  }
  return {w,note:"Same weight as last time. Try to beat your reps."};
}
function today(){const k=todayStr(); if(!S.daily[k]) S.daily[k]={meals:[false,false,false,false],water:0,creatine:false,produce:0,sleep:false}; return S.daily[k];}
function nutrition(){
  const p=S.profile,w=curWeight(); if(!w||!p.age||!p.height) return null;
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==="m"?5:-161);
  const tdee=bmr*(p.days>=4?1.55:1.45);
  // Fat loss: ~500 kcal/day deficit for men, ~300 for women (gentler on a smaller frame),
  // never below 1.2 x BMR or a safe floor so training and recovery don't suffer.
  const adj=p.goal&&p.goal<w-0.5?(p.sex==="m"?-500:-300):(p.goal&&p.goal>w+0.5?250:0);
  const floor=Math.max(bmr*1.2,p.sex==="m"?1800:1400);
  const kcal=Math.round(Math.max(tdee+adj,adj<0?floor:0)/50)*50;
  const protein=Math.round(w*(p.sex==="m"?1.8:1.6)/5)*5;
  const fat=Math.round(w*0.8/5)*5;
  const carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4/5)*5);
  return {kcal,protein,fat,carbs,perMeal:Math.round(protein/4/5)*5,adj};
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

let AC=null;
function beep(f=880,d=.15){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function buzz(){try{navigator.vibrate&&navigator.vibrate([200,80,200])}catch(e){}}
let wakeLock=null;
async function keepAwake(on){try{if(on&&navigator.wakeLock&&!wakeLock) wakeLock=await navigator.wakeLock.request("screen"); if(!on&&wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}

/* ---------- Timer ---------- */
let TM=null;
function runTimer(title,segs,onDone){
  if(TM) clearInterval(TM.iv);
  TM={title,segs,i:0,left:segs[0].secs,paused:false,onDone};
  $("#timer").hidden=false; drawTimer(); TM.iv=setInterval(tick,1000); beep(700,.1);
}
function tick(){
  if(!TM||TM.paused) return;
  TM.left--;
  if(TM.left>0&&TM.left<=3) beep(600,.07);
  if(TM.left<=0){ beep(990,.3); buzz(); TM.i++;
    if(TM.i>=TM.segs.length){ endTimer(); return; }
    TM.left=TM.segs[TM.i].secs; }
  drawTimer();
}
function drawTimer(){
  const s=TM.segs[TM.i];
  $("#tTitle").textContent=TM.title; $("#tBig").textContent=fmtClock(TM.left);
  $("#tSeg").textContent=s.label; $("#tSub").textContent=s.sub||"";
  $("#tPause").textContent=TM.paused?"Resume":"Pause";
}
function endTimer(){ if(!TM) return; clearInterval(TM.iv); const cb=TM.onDone; TM=null; $("#timer").hidden=true; cb&&cb(); }
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2600)}

    <ul class="plain small" style="margin-top:6px">
      <li><span><b>Creatine monohydrate</b>, 3–5 g daily, any time. Well studied for strength and sprint repeats. Expect 1–2 kg of water weight early on; that's normal.</span></li>
      <li><span><b>Whey or plant protein</b> only to fill the gap when meals fall short of ${n.protein} g.</span></li>
      <li><span><b>Vitamin D</b> if a blood test shows you're low, especially if you work indoors.</span></li>
      <li><span><b>Electrolytes</b> on hot match and practice days.</span></li>
    </ul>
    <p class="muted small" style="margin-top:8px">Check with your doctor before starting supplements if you have a medical condition or take medication.</p>
  </section>`;
}

function chartSVG(){
  if(!S.weights.length) return `<p class="muted small">Log your first weigh-in to start the chart.</p>`;
  const W=320,H=170,pl=30,pr=10,pt=10,pb=24,goal=S.profile.goal||null;
  const st=new Date(S.profile.start+"T00:00:00");
  const pts=S.weights.map(x=>({d:(new Date(x.date+"T00:00:00")-st)/864e5,kg:x.kg}));
  const all=pts.map(p=>p.kg).concat(goal?[goal]:[]);
  const lo=Math.floor(Math.min(...all)-1),hi=Math.ceil(Math.max(...all)+1);
  const X=d=>pl+Math.max(0,Math.min(182,d))/182*(W-pl-pr), Y=k=>pt+(hi-k)/(hi-lo)*(H-pt-pb);
  const line=pts.map(p=>X(p.d).toFixed(1)+","+Y(p.kg).toFixed(1)).join(" ");
  const ticks=[lo,Math.round((lo+hi)/2),hi];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weight chart">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="2" y="${Y(t)+3}">${t}</text>`).join("")}
    ${goal?`<line x1="${X(0)}" y1="${Y(startWeight())}" x2="${X(182)}" y2="${Y(goal)}" stroke="var(--pitch)" stroke-dasharray="4 4" stroke-width="1.5"/>`:""}
    <polyline points="${line}" fill="none" stroke="var(--ball)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${X(p.d)}" cy="${Y(p.kg)}" r="3.5" fill="var(--ball)"/>`).join("")}
    <text x="${pl}" y="${H-6}">Start</text><text x="${W-pr-38}" y="${H-6}">Month 6</text>
  </svg>`;
}

function progressHTML(){
  const wk=weekNo(),P=PH[phaseIdx()],cw=curWeight(),g=S.profile.goal;
  let status="Log your weight below to start tracking.";
  if(cw){ const parts=[], ch=+(cw-startWeight()).toFixed(1);
    if(ch) parts.push((ch<0?Math.abs(ch)+" kg down":ch+" kg up")+" since you started");
    if(g){ const left=+(cw-g).toFixed(1); parts.push(Math.abs(left)<0.3?"you're at your goal":Math.abs(left)+" kg to your goal of "+g+" kg"); }
    status=parts.length?parts.join(", "):"Weigh in weekly to see your trend."; status=status[0].toUpperCase()+status.slice(1); }
  const thisWeek=S.logs.filter(l=>(Date.now()-new Date(l.date+"T00:00:00"))/864e5<7).length;
  return `
  <header class="band">${whoBar()}<p class="muted small">Week ${wk} of 26, ${P.name}</p><h1 class="num">${cw?cw+" kg":"No weigh-in yet"}</h1><p class="muted small" style="margin-top:6px">${status}</p>
    <div class="bar" style="margin-top:12px;background:rgba(255,255,255,.25)"><i style="width:${wk/26*100}%"></i></div></header>
  <section class="card"><div class="grid4" style="grid-template-columns:repeat(3,1fr)">
    <div class="stat"><b class="num">${S.logs.length}</b><span>workouts</span></div>
    <div class="stat"><b class="num">${thisWeek}/${S.profile.days}</b><span>this week</span></div>
    <div class="stat"><b class="num">${26-wk}</b><span>weeks left</span></div></div></section>
  <section class="card"><h3>Weight</h3><p class="muted small">Weigh in once a week, same morning, before breakfast.${g?" Dashed line is your target pace.":""}</p>
    ${chartSVG()}
    <div class="row" style="margin-top:10px"><input type="number" step="0.1" inputmode="decimal" id="wIn" placeholder="Today's weight in kg" aria-label="Today's weight in kg"><button class="btn sm" data-act="logweight">Log</button></div>
  </section>
  <section class="card"><h3>Workout history</h3>
    ${S.logs.length?`<p class="muted small">Tap a workout to see every set.</p>
      <div style="margin-top:4px">${S.logs.map((l,i)=>i).reverse().slice(0,SHOWALL?undefined:10).map(i=>{const l=S.logs[i],st=logStats(l);
        return `<button class="chk" data-act="viewlog" data-i="${i}"><span class="grow"><b>${esc(logName(l))}</b><br><span class="muted small num">${fmtDate(l.date)}${l.mins?", "+l.mins+" min":""}</span></span><span class="muted small num" style="text-align:right">${st.ex} exercises<br>${st.sets} sets</span></button>`}).join("")}</div>
      ${S.logs.length>10?`<button class="btn ghost sm" style="margin-top:10px" data-act="showall">${SHOWALL?"Show fewer":"Show all "+S.logs.length+" workouts"}</button>`:""}`
    :`<p class="muted small">Finished workouts show up here. Start one from Today.</p>`}
  </section>
  ${bestLifts()}`;
}

/* ---------- Workout history ---------- */
let VIEW=null, SHOWALL=false;
function fmtDate(ds,long){
  const d=new Date(ds+"T00:00:00");
  return d.toLocaleDateString(undefined,long?{weekday:"long",month:"long",day:"numeric",year:"numeric"}:{weekday:"short",month:"short",day:"numeric"});
}
function logName(l){return l.name||getW(l.wid)?.name||"Workout"}
function logStats(l){const ids=Object.keys(l.sets||{});return {ex:ids.length,sets:ids.reduce((a,id)=>a+l.sets[id].length,0)}}
function setTxt(ex,st){
  if(!ex) return st.reps?st.reps+" reps":"Done";
  if(st.manual) return "Done";
  if(st.rounds) return st.rounds+" rounds";
  if(st.secs) return fmtDur(st.secs)+perTxt(ex);
  return st.reps+" reps"+perTxt(ex)+(st.w?" at "+st.w+" lb":"");
}
function setsSummary(ex,sets){
  if(!sets||!sets.length) return "";
  if(ex.type!=="reps") return sets.map(s=>setTxt(ex,s)).join(", ");
  const ws=[...new Set(sets.map(s=>s.w||0))];
  if(ws.length===1) return sets.map(s=>s.reps).join(", ")+" reps"+(ws[0]?" at "+ws[0]+" lb":"");
  return sets.map(s=>s.reps+(s.w?" × "+s.w+" lb":"")).join(", ");
}
function logDetailHTML(i){
  const l=S.logs[i]; if(!l){VIEW=null;return progressHTML();}
  const w=getW(l.wid), order=[...(w?w.items:[]),...Object.keys(l.sets)].filter((x,k,a)=>a.indexOf(x)===k&&l.sets[x]);
  const st=logStats(l);
  let vol=0; order.forEach(id=>l.sets[id].forEach(s=>{if(s.w&&s.reps) vol+=s.w*s.reps*(EX[id]&&EX[id].eq==="db"?2:1);}));
  return `
  <header class="band">
    <button class="btn ghost sm" data-act="closelog" style="color:inherit;border-color:currentColor;margin-bottom:14px">Back to progress</button>
    <p class="muted small">${fmtDate(l.date,true)}</p>
    <h1>${esc(logName(l))}</h1>
  </header>
  <section class="card"><div class="grid4" style="grid-template-columns:repeat(${vol?4:3},1fr)">
    <div class="stat"><b class="num">${st.ex}</b><span>exercises</span></div>
    <div class="stat"><b class="num">${st.sets}</b><span>sets</span></div>
    <div class="stat"><b class="num">${l.mins||"–"}</b><span>minutes</span></div>
    ${vol?`<div class="stat"><b class="num">${vol>=10000?(vol/1000).toFixed(1)+"k":vol}</b><span>lb lifted</span></div>`:""}
  </div></section>
  ${order.map(id=>{const ex=EX[id],sets=l.sets[id];
    return `<section class="card"><h3>${ex?ex.name:esc(id)}</h3>
      <ul class="plain small" style="margin-top:6px">${sets.map((s,k)=>`<li><span>Set ${k+1}</span><span class="num">${setTxt(ex,s)}</span></li>`).join("")}</ul></section>`}).join("")}
  <button class="btn ghost" data-act="dellog" data-i="${i}" style="color:var(--ball);margin-top:4px">Delete this workout</button>`;
}
function bestLifts(){
  const ids=["deadlift","bench","bb_row","rdl","hip_thrust","pullup"];
  const rows=ids.map(id=>{let best=null;S.logs.forEach(l=>(l.sets[id]||[]).forEach(s=>{if(!best||(s.w||0)>best.w||((s.w||0)===best.w&&s.reps>best.reps))best={w:s.w||0,reps:s.reps};}));return best?`<li><span>${EX[id].name}</span><span class="muted num">${best.w?best.w+" lb × ":""}${best.reps} reps</span></li>`:""}).join("");
  return rows?`<section class="card"><h3>Best sets</h3><ul class="plain small" style="margin-top:6px">${rows}</ul></section>`:"";
}

function profileHTML(){
  const p=S.profile, rot=rotation().map(id=>getW(id).name).join(", ");
  return `
  <header class="band">${whoBar()}<h1>${esc(p.name)}'s profile</h1><p class="muted small" style="margin-top:6px">Used to set food targets and the plan.</p></header>
  <section class="card">
    <div class="field"><label for="pN">Name</label><input id="pN" type="text" value="${esc(p.name)}" data-p="name"></div>
    <div class="grid2">
      <div class="field"><label for="pAge">Age</label><input id="pAge" type="number" inputmode="numeric" value="${p.age||""}" placeholder="Years" data-p="age"></div>
      <div class="field"><label for="pH">Height (cm)</label><input id="pH" type="number" inputmode="numeric" value="${p.height||""}" placeholder="cm" data-p="height"></div>
      <div class="field"><label for="pSex">Sex</label><select id="pSex" data-p="sex"><option value="m" ${p.sex==="m"?"selected":""}>Male</option><option value="f" ${p.sex==="f"?"selected":""}>Female</option></select></div>
      <div class="field"><label for="pG">Goal weight (kg)</label><input id="pG" type="number" inputmode="decimal" step="0.5" value="${p.goal||""}" placeholder="Optional" data-p="goal"></div>
      <div class="field"><label for="pD">Days per week</label><select id="pD" data-p="days"><option value="3" ${p.days==3?"selected":""}>3 days</option><option value="4" ${p.days==4?"selected":""}>4 days</option></select></div>
      <div class="field"><label for="pDiet">Diet</label><select id="pDiet" data-p="diet">
        <option value="any" ${p.diet==="any"?"selected":""}>Eat everything</option><option value="egg" ${p.diet==="egg"?"selected":""}>Vegetarian + eggs</option>
        <option value="veg" ${p.diet==="veg"?"selected":""}>Vegetarian</option><option value="vegan" ${p.diet==="vegan"?"selected":""}>Vegan</option></select></div>
    </div>
    <div class="field"><label for="pS">Plan start date</label><input id="pS" type="date" value="${p.start}" data-p="start"></div>
    <label style="display:flex;gap:10px;align-items:center;color:var(--ink);font-size:16px"><input type="checkbox" style="width:22px;height:22px" ${p.cricket?"checked":""} data-p="cricket"> Show cricket tips on exercises</label>
    <p class="muted small" style="margin-top:10px">Your rotation: ${esc(rot)}.</p>
  </section>
  <section class="card"><h3>Backup</h3>
    <p class="muted small">History is saved on this phone. Save a backup every few weeks so nothing is lost if you change phones or clear Safari data. The backup includes both profiles.</p>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost sm grow" data-act="export">Save backup</button>
      <label class="btn ghost sm grow" style="display:block;text-align:center;color:var(--ink);margin:0;cursor:pointer">Restore backup<input type="file" id="importF" accept="application/json,.json" hidden></label>
    </div>
  </section>
  <section class="card"><h3>Equipment</h3><p class="muted small">Barbell and plates, bench, dumbbells 5–25 lb, bands, pull-up/dip station, treadmill, bike, yoga mat. Every exercise uses only these.</p></section>
  <button class="btn ghost" data-act="wipe" style="color:var(--ball)">Erase ${esc(p.name)}'s data</button>`;
}

/* ---------- Render ---------- */
function render(){
  const v=$("#view"),t=S.tab;
  if(t==="today"&&S.session) v.innerHTML=sessionHTML();
  else if(t==="progress"&&VIEW!==null) v.innerHTML=logDetailHTML(VIEW);
  else v.innerHTML=({today:todayHTML,plan:planHTML,food:foodHTML,progress:progressHTML,profile:profileHTML})[t]();
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===t?"page":"false"));
}
function go(tab){S.tab=tab;VIEW=null;save();render();window.scrollTo(0,0)}

/* ---------- Session logic ---------- */
function startSession(wid){
  const w=getW(wid);
  S.session={wid,idx:0,set:1,count:0,weight:0,note:"",done:{},started:Date.now()};
  prepEx(); S.tab="today"; keepAwake(true); save(); render(); window.scrollTo(0,0);
}
function prepEx(){
  const s=S.session,id=getW(s.wid).items[s.idx]; if(!id) return;
  const sg=suggest(s.wid,id); s.weight=sg.w; s.note=sg.note; s.count=0;
  s.set=(s.done[id]||[]).length+1;
}
function curEx(){const s=S.session;return getW(s.wid).items[s.idx]}
function record(entry){
  const s=S.session,id=curEx(),t=tgt(s.wid,id);
  (s.done[id]=s.done[id]||[]).push(entry);
  s.count=0;
  if(s.done[id].length<t.sets){
    s.set=s.done[id].length+1; save(); render();
    runTimer("Rest",[{label:"Rest",secs:t.rest,sub:`Next: set ${s.set} of ${t.sets}`}],()=>{});
  } else nextEx(true);
}
function nextEx(restFirst){
  const s=S.session,w=getW(s.wid);
  if(s.idx>=w.items.length-1){ save(); render(); toast("Last exercise done. Tap Finish to save."); return; }
  s.idx++; prepEx(); save(); render(); window.scrollTo(0,0);
  if(restFirst) runTimer("Rest",[{label:"Next exercise",secs:60,sub:EX[curEx()].name}],()=>{});
}
function finishSession(){
  const s=S.session;
  const any=Object.keys(s.done).length>0;
  if(any) S.logs.push({date:todayStr(),wid:s.wid,name:getW(s.wid).name,sets:s.done,mins:Math.round((Date.now()-s.started)/60000)});
  S.session=null; keepAwake(false); save(); render(); window.scrollTo(0,0);
  toast(any?"Workout saved. Get your protein in.":"Workout ended. Nothing logged.");
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]"); if(tb){go(tb.dataset.tab);return;}
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act,s=S.session;
  if(a==="howtoggle") return;
  switch(a){
    case "start": startSession(b.dataset.w); break;
    case "count": s.count++; beep(520,.05); try{navigator.vibrate&&navigator.vibrate(20)}catch(_){}
      { const c=document.querySelector("#ball .count"); if(c){c.textContent=s.count; const bl=$("#ball"); bl.classList.remove("pop"); void bl.offsetWidth; bl.classList.add("pop"); bl.setAttribute("aria-label","Count a rep. Current count "+s.count); const d=[...document.querySelectorAll("[data-act=doneset]")][0]; if(d) d.textContent=`Done set (${s.count} reps)`; } }
      save(); break;
    case "minus": s.count=Math.max(0,s.count-1); save(); render(); break;
    case "wplus": s.weight+=5; save(); render(); break;
    case "wminus": s.weight=Math.max(0,s.weight-5); save(); render(); break;
    case "doneset": record({reps:s.count,w:s.weight}); break;
    case "timeset": { const id=curEx(),ex=EX[id],t=tgt(s.wid,id);
      const segs=ex.per==="side"?[{label:"Left side",secs:t.secs},{label:"Switch sides",secs:5},{label:"Right side",secs:t.secs}]:[{label:"Go",secs:t.secs}];
      runTimer(ex.name,segs,()=>record({secs:t.secs,reps:0})); break; }
    case "interval": { const id=curEx(),t=tgt(s.wid,id),segs=[];
      for(let r=1;r<=t.rounds;r++){segs.push({label:"Hard",secs:t.work,sub:`Round ${r} of ${t.rounds}`}); if(r<t.rounds) segs.push({label:"Easy",secs:t.rest,sub:`Round ${r+1} next`});}
      runTimer(EX[id].name,segs,()=>{(s.done[id]=s.done[id]||[]).push({rounds:t.rounds,reps:0}); nextEx(false);}); break; }
    case "marktime": { const id=curEx(),t=tgt(s.wid,id); (s.done[id]=s.done[id]||[]).push({reps:0,manual:true}); if(EX[id].type==="interval"||(s.done[id].length>=t.sets)) nextEx(false); else {s.set++;save();render();} break; }
    case "prevex": if(s.idx>0){s.idx--;prepEx();save();render();window.scrollTo(0,0);} break;
    case "skipex": nextEx(false); break;
    case "jump": s.idx=+b.dataset.i; prepEx(); save(); render(); window.scrollTo(0,0); break;
    case "finish": finishSession(); break;
    case "quit": if(confirm("End this workout? Sets you've done so far will be saved.")) finishSession(); break;
    case "who": VIEW=null; switchTo(b.dataset.id); break;
    case "viewlog": VIEW=+b.dataset.i; render(); window.scrollTo(0,0); break;
    case "closelog": VIEW=null; render(); window.scrollTo(0,0); break;
    case "showall": SHOWALL=!SHOWALL; render(); break;
    case "dellog": if(confirm("Delete this workout from your history?")){S.logs.splice(+b.dataset.i,1);VIEW=null;save();render();window.scrollTo(0,0);toast("Workout deleted");} break;
    case "export": exportData(); break;
    case "tpause": if(TM){TM.paused=!TM.paused;drawTimer();} break;
    case "tskip": endTimer(); break;
    case "meal": { const d=today(); d.meals[+b.dataset.i]=!d.meals[+b.dataset.i]; save(); render(); break; }
    case "creatine": { const d=today(); d.creatine=!d.creatine; save(); render(); break; }
    case "sleep": { const d=today(); d.sleep=!d.sleep; save(); render(); break; }
    case "water": { const d=today(); d.water=Math.max(0,Math.min(12,d.water+ +b.dataset.v)); save(); render(); break; }
    case "produce": { const d=today(); d.produce=Math.max(0,Math.min(10,d.produce+ +b.dataset.v)); save(); render(); break; }
    case "logweight": { const v=parseFloat($("#wIn").value); if(!(v>30&&v<300)){toast("Enter your weight in kg, like 68.4");break;}
      const t=todayStr(),ex=S.weights.find(x=>x.date===t); if(ex) ex.kg=v; else S.weights.push({date:t,kg:v});
      S.weights.sort((a,b)=>a.date.localeCompare(b.date)); save(); render(); toast("Weight logged. Food targets updated."); break; }
    case "resetex": delete S.overrides[b.dataset.w+":"+b.dataset.x]; save(); render(); break;
    case "removeex": { const w=getW(b.dataset.w); if(w.items.length>1){w.items.splice(+b.dataset.i,1);save();render();} break; }
    case "resetplan": if(confirm("Reset all workouts to the default plan?")){S.plan=planFor(R.active);S.overrides={};save();render();} break;
    case "wipe": if(confirm("Erase all of "+S.profile.name+"'s workouts, weights and settings?")){const nm=S.profile.name;R.people[R.active]=defaultPerson(R.active);S=R.people[R.active];S.profile.name=nm;save();render();} break;
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.edit){const k=el.dataset.w+":"+el.dataset.x;(S.overrides[k]=S.overrides[k]||{})[el.dataset.edit]=+el.value;save();render();toast("Plan updated");}
  else if(el.dataset.swap&&el.value){const w=getW(el.dataset.swap);w.items[+el.dataset.i]=el.value;save();render();toast("Swapped in "+EX[el.value].name);}
  else if(el.dataset.add&&el.value){const w=getW(el.dataset.add);w.items.splice(Math.max(0,w.items.length-1),0,el.value);save();render();toast("Added "+EX[el.value].name);}
  else if(el.dataset.p){const k=el.dataset.p;S.profile[k]=el.type==="checkbox"?el.checked:(["sex","diet","start","name"].includes(k)?el.value:+el.value);save();render();toast("Saved");}
  else if(el.id==="importF"&&el.files&&el.files[0]){importData(el.files[0]);el.value="";}
});
document.addEventListener("toggle",e=>{ if(e.target.dataset&&e.target.dataset.act==="howtoggle"&&S.session){S.session.howOpen=e.target.open;save();} },true);

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
load();
</script>
</body>
</html>
